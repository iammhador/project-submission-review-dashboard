services:
  postgres:
    image: postgres:17-alpine
    container_name: awi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: awi
      POSTGRES_PASSWORD: awi
      POSTGRES_DB: awi
    ports:
      - "5432:5432"
    volumes:
      - awi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awi -d awi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  awi-postgres-data:
